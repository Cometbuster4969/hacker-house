[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hhgoa-fraud-agent"
version = "1.0.0"
description = "Agentic fraud investigation with a policy-bound engine on TigerGraph (HHGOA 2026 Partner Challenge)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HHGOA TigerGraph team" }]
keywords = ["tigergraph", "fraud", "agentic", "gsql", "sar", "graphrag"]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0,<2",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.3.0",
    "pyarrow>=14.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Dashboard (python main.py serve)
ui = ["fastapi>=0.104.0", "uvicorn>=0.24.0", "jinja2>=3.1.0"]
# Live TigerGraph write-back + GSQL install
tigergraph = ["pyTigerGraph>=1.6.0", "mcp>=1.2,<2", "networkx>=3.0"]
# Legacy LLM orchestrator (python main.py investigate --legacy)
llm = ["openai>=1.6.0", "anthropic>=0.39.0"]
dev = ["pytest>=7.4.0", "ruff>=0.4"]
all = ["hhgoa-fraud-agent[ui,tigergraph,llm,dev]"]

[project.scripts]
hhgoa = "main:main"

[project.urls]
Documentation = "https://github.com/Cometbuster4969/hacker-house#readme"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
